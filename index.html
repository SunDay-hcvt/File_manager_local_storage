<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxTSun</title>
    <link rel="icon" type="image/svg+xml" href="img/sun.svg">
    <link rel="stylesheet" type="text/css" href="styles/index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="forms-container">
            <div class="signin-signup">
                <form class="sign-in-form" autocomplete="off">
                    <h2 class="title">Chào mừng đến với BoxTSun!</h2>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Tên đăng nhập" required />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Mật khẩu" required />
                    </div>
                    <input type="submit" value="Đăng nhập" class="btn solid" />
                </form>

                <form class="sign-up-form" autocomplete="off">
                    <h2 class="title">Đăng ký</h2>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Tên đăng nhập" required />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Mật khẩu" required />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Nhập lại mật khẩu" required />
                    </div>
                    <input type="submit" value="Xác nhận" class="btn solid" />
                </form>
            </div>
        </div>

        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h3>Chưa có tài khoản?</h3>
                    <p>Đăng ký ngay để trải nghiệm đầy đủ tính năng và lưu trữ dữ liệu.</p>
                    <button class="btn transparent" id="sign-up-btn" type="button">Đăng ký</button>
                </div>
                <img src="img/log.svg" class="image" alt="">
            </div>

            <div class="panel right-panel">
                <div class="content">
                    <h3>Đã có tài khoản?</h3>
                    <p>Đăng nhập ngay để tiếp tục hành trình của bạn mà không bỏ lỡ bất kỳ điều gì.</p>
                    <button class="btn transparent" id="sign-in-btn" type="button">Đăng nhập</button>
                </div>
                <img src="img/register.svg" class="image" alt="">
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
